<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="dashboard.css">
<style>html,body{height:720px !important;}</style>
</head>
<body>
  <div id="titlebar"></div>
  <div id="shell">
    <nav id="side" aria-label="Sections">
      <div class="brand"><span class="wordmark"></span></div>
      <div class="side-group">
        <div class="side-label">Days</div>
        <div id="day-list"></div>
      </div>
      <div class="side-group">
        <div class="side-label">Across time</div>
        <button class="side-item" data-section="patterns"><span>Patterns</span><span class="side-count">3</span></button>
        <button class="side-item" data-section="automations"><span>Automations</span></button>
        <button class="side-item" data-section="routines"><span>Routines</span></button>
      </div>
      <div class="side-group">
        <div class="side-label">About you</div>
        <button class="side-item" data-section="memory"><span>Memory</span></button>
        <button class="side-item" data-section="settings"><span>Settings</span></button>
      </div>
      <div class="side-foot"><span id="side-status"><i></i><span>paused</span></span></div>
    </nav>
    <main id="main"><header id="main-head"><h1 id="title">Today</h1><p id="subtitle">x</p></header><div id="content"></div></main>
  </div>
<script>
const N = Number(new URLSearchParams(location.search).get('n') || 14);
const list = document.getElementById('day-list');
for (let i=0;i<N;i++){
  const b=document.createElement('button'); b.className='side-item'; b.dataset.day='d'+i;
  const s=document.createElement('span'); s.textContent = i===0?'Today':(i===1?'Yesterday':'Mon, Aug '+(23-i));
  b.appendChild(s);
  const sub=document.createElement('span'); sub.className='sub'; sub.textContent='128'; b.appendChild(sub);
  list.appendChild(b);
}
window.__m = () => {
  const side=document.getElementById('side');
  const brand=document.querySelector('.brand');
  const groups=[...document.querySelectorAll('.side-group')];
  const labels=[...document.querySelectorAll('.side-label')];
  const items=[...document.querySelectorAll('.side-item')];
  const foot=document.querySelector('.side-foot');
  const cs=getComputedStyle(side);
  const dayItems=[...list.children];
  const patterns=document.querySelector('[data-section="patterns"]');
  const settings=document.querySelector('[data-section="settings"]');
  const r=(e)=>{const b=e.getBoundingClientRect();return {top:+b.top.toFixed(2),bottom:+b.bottom.toFixed(2),h:+b.height.toFixed(2)}};
  return {
    viewport: innerHeight,
    sideClientH: side.clientHeight,
    sideScrollH: side.scrollHeight,
    sideOverflow: cs.overflowY,
    sidePadding: cs.paddingTop+' / '+cs.paddingBottom,
    brand: r(brand),
    labelH: labels[0].getBoundingClientRect().height,
    labelMarginBottomOfGroup: getComputedStyle(groups[0]).marginBottom,
    oneItemH: items[0].getBoundingClientRect().height,
    itemMargin: getComputedStyle(items[0]).marginBottom,
    itemStride: dayItems.length>1 ? +(dayItems[1].getBoundingClientRect().top - dayItems[0].getBoundingClientRect().top).toFixed(2) : null,
    firstDay: dayItems.length?r(dayItems[0]):null,
    lastDay: dayItems.length?r(dayItems[dayItems.length-1]):null,
    patterns: r(patterns),
    settings: r(settings),
    foot: r(foot),
    footMarginTop: getComputedStyle(foot).marginTop,
  };
};
</script>
</body></html>
