<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>fren</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="private">
  <div id="stage">
    <!-- Conversation sits above the orb, so the orb never moves on screen
         when the window grows. -->
    <section id="panel" hidden>
      <header id="panel-head">
        <svg class="wordmark" viewBox="0 0 296 118" width="62" aria-label="fren" role="img">
          <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="18">
            <path d="M30 100V36Q30 15 51 15"/>
            <path d="M13 49H51"/>
            <path d="M88 100V41"/>
            <path d="M88 59Q88 41 112 41"/>
            <circle cx="172" cy="70" r="31"/>
            <path d="M143 70H201" stroke-width="16"/>
            <path d="M234 100V41"/>
            <path d="M234 59Q234 41 256 41Q278 41 278 63V100"/>
          </g>
          <!-- the counter of the "e" holds fren's own smile -->
          <path d="M151 79Q172 99 193 79Z" fill="var(--orange)"/>
        </svg>
        <span id="gateway-dot" title="thinking half"></span>
        <span class="spacer"></span>
        <button id="toggle-observe" class="ghost">wake up</button>
        <button id="quit" class="icon" title="Quit fren">&#215;</button>
      </header>

      <div id="messages">
        <div id="empty">
          <p class="empty-line">Ask me what you've been up to.</p>
          <div class="chips">
            <button class="chip">What have I been doing?</button>
            <button class="chip">Anything I could automate?</button>
            <button class="chip">Summary of my day</button>
          </div>
        </div>
        <div id="typing" hidden><i></i><i></i><i></i></div>
      </div>

      <form id="input-row">
        <input id="chat-input" type="text" placeholder="Ask fren…" autocomplete="off" spellcheck="false">
        <button id="send" type="submit" aria-label="Send">&#8593;</button>
      </form>
    </section>

    <div id="orb-zone">
      <div id="orb" title="fren"></div>
    </div>
  </div>
<script src="face/face.js"></script>
<script src="app.js"></script>
</body>
</html>
