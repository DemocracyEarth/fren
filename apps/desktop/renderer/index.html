<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' fren:; style-src 'self' 'unsafe-inline'; script-src 'self' fren:; connect-src 'self' fren:; img-src 'self' fren: data:">
<title>fren</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="private">
  <div id="stage">
    <!-- Conversation sits above the orb, so the orb never moves on screen
         when the window grows. -->
    <section id="panel" hidden>
      <header id="panel-head">
        <svg class="wordmark" viewBox="0 0 300 118" width="76" aria-label="fren" role="img">
          <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="17">
            <path d="M30 100V36Q30 15 51 15"/>
            <path d="M13 49H51"/>
            <path d="M88 100V41"/>
            <path d="M88 59Q88 41 112 41"/>
            <!-- the "e" keeps a real aperture at 4 o'clock so it doesn't read as a theta -->
            <path d="M184.7 101.5A34 34 0 1 1 204.8 78.8"/>
            <path d="M139 70H200" stroke-width="13"/>
            <path d="M240 100V41"/>
            <path d="M240 59Q240 41 262 41Q284 41 284 63V100"/>
          </g>
          <!-- and its lower counter holds fren's own smile -->
          <path d="M146.3 76.5Q172 116 197.7 76.5Z" fill="var(--orange)"/>
        </svg>
        <div class="head-text">
          <span id="status-line">
            <span id="status-dot"></span><span id="status-label">paused</span>
          </span>
        </div>
        <span class="spacer"></span>
        <span id="gateway-dot" title="thinking half"></span>
        <button id="toggle-observe" class="ghost">wake up</button>
        <button id="quit" class="icon" title="Quit fren">&#215;</button>
      </header>

      <!-- One row of tabs rather than buttons scattered through the header.
           The reference design puts navigation on the left; at this width a
           strip reads the same way and leaves the content its full span. -->
      <nav id="tabs" role="tablist" aria-label="Views">
        <button class="tab on" data-view="chat" role="tab" aria-selected="true">Talk</button>
        <button class="tab" data-view="patterns" role="tab" aria-selected="false">
          Patterns<span id="pattern-count" class="pill" hidden>0</span>
        </button>
        <button class="tab" data-view="know" role="tab" aria-selected="false">Memory</button>
        <span class="tabs-spacer"></span>
        <button id="open-dash" class="tab tab-open" title="Open the full window">Open ↗</button>
      </nav>

      <section id="patterns" hidden aria-label="What fren has noticed">
        <div id="patterns-body"></div>
      </section>

      <section id="know" hidden aria-label="What fren has recorded about you">
        <p class="know-intro">
          Everything fren holds about you, exactly as written on disk. Plain
          files — edit them and the change takes effect on your next message.
        </p>
        <label id="volunteer-row" hidden>
          <input type="checkbox" id="volunteer" />
          <span>
            <strong>Let fren interrupt you</strong>
            Every so often it asks about something you're working on, and keeps
            what it learns in <code>MEMORY.md</code>. A few times a day at most.
          </span>
        </label>
        <label id="wake-row" hidden>
          <input type="checkbox" id="wake-on-launch" />
          <span>
            <strong>Wake up when you launch me</strong>
            My light comes on as soon as I open, which means I'm watching. Turn
            this off and I'll wait in the dark until you tap me.
          </span>
        </label>
        <div id="know-files"></div>
        <button id="open-folder" class="ghost wide">Open the folder</button>
      </section>

      <div id="messages" role="log" aria-live="polite" aria-label="Conversation with fren">
        <div id="empty">
          <p class="empty-line">Ask me what you've been up to.</p>
          <p class="empty-sub">I only know which apps and windows you've had open,
            and only while my light was on.</p>
          <div class="chips">
            <button class="chip">What have I been doing?</button>
            <button class="chip">Anything I could automate?</button>
            <button class="chip">Summary of my day</button>
          </div>
        </div>
        <div id="typing" hidden><i></i><i></i><i></i></div>
      </div>

      <form id="input-row">
        <button id="mic" type="button" aria-label="Hold to talk" title="Hold to talk">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"
                  fill="currentColor"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="look" type="button" hidden
                aria-label="Let fren look at your screen once, to answer this"
                title="Look at my screen (sends one screenshot)">&#128065;</button>
        <input id="chat-input" type="text" placeholder="Ask fren…" autocomplete="off" spellcheck="false">
        <button id="send" type="submit" aria-label="Send">&#8593;</button>
      </form>
    </section>

    <div id="orb-zone">
      <button id="orb" type="button" aria-label="Open fren"></button>
    </div>
  </div>
<script src="face/reactions.js"></script>
<script src="mic.js"></script>
<!-- The SVG renderer loads first and stays as the fallback. orb.js replaces it
     with the 3D one only if WebGL actually works here, so a graphics failure
     degrades to a working face instead of a blank window. Module scripts run
     in order after the classic ones, so app.js sees whichever won. -->
<script src="face/face.js"></script>
<script type="module" src="face/orb.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
