<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' fren:; style-src 'self' 'unsafe-inline'; script-src 'self' fren:; connect-src 'self' fren:; img-src 'self' fren: data:">
<title>fren</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="private">
  <div id="stage">
    <!-- Conversation sits above the orb, so the orb never moves on screen
         when the window grows. -->
    <section id="panel" hidden>
      <header id="panel-head">
        <!-- One light, not three. The owner pared the app down to the orb
             and this chat: the dashboard lost its doors (its features moved
             into the conversation itself — ask fren to change a setting and
             it does), and closing the chat is what clicking the orb already
             does. What remains is the one decision that needs a control: red
             quits, and asks first. -->
        <div id="lights" role="group" aria-label="Window controls">
          <button id="light-quit" class="light" title="Quit fren"
                  aria-label="Quit fren"><span aria-hidden="true">&#215;</span></button>
        </div>
        <span class="wordmark" role="img" aria-label="fren"></span>
        <span class="spacer"></span>
        <span id="gateway-dot" title="fren cannot reach its thinking half"></span>
        <!-- One control, not two. Whether fren is watching is the most
             important fact in this window, and the thing you most often want to
             change about it — so saying it and changing it are the same button.
             It sits beside the Dashboard button rather than beside the logo:
             these are the two things you actually press, and grouping them
             leaves the left side as identity alone. -->
        <!-- The door to the model settings: which brain, which voice, which
             ear. Everything else about fren answers to conversation; the
             machinery it runs ON deserves a real pane, because a mistyped
             model id with no feedback is a silent outage. -->
        <button id="gear" type="button" class="icon-btn" title="Models &amp; voice"
                aria-label="Models and voice settings">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10.05 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.63.87 1.04 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.95z"/>
          </svg>
        </button>
        <button id="watch" type="button" role="switch" aria-checked="false">
          <span id="watch-dot" aria-hidden="true"></span><span id="watch-label"
            ><span class="w-on">watching</span><span class="w-off">paused</span></span>
        </button>
        <!-- The light can change without this button being pressed: from the orb,
             or by main at launch. Announce it, or the fact that matters most in
             this window is the one a screen reader never hears. -->
        <span id="watch-say" class="sr-only" role="status" aria-live="polite"></span>

      </header>

      <div id="messages" role="log" aria-live="polite" aria-label="Conversation with fren">
        <div id="empty">
          <p class="empty-line">Ask me what you've been up to.</p>
          <p class="empty-sub">I only know which apps and windows you've had open,
            and only while my light was on.</p>
          <div class="chips">
            <button class="chip">What have I been doing?</button>
            <button class="chip">Anything I could automate?</button>
            <button class="chip">Summary of my day</button>
          </div>
        </div>
        <div id="typing" hidden><i></i><i></i><i></i></div>
      </div>

      <form id="input-row">
        <button id="mic" type="button" aria-label="Hold to talk" title="Hold to talk">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z"
                  fill="currentColor"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="look" type="button" hidden
                aria-label="Let fren look at your screen once, to answer this"
                title="Look at my screen (sends one screenshot)">&#128065;</button>
        <input id="chat-input" type="text" placeholder="Ask fren…" autocomplete="off" spellcheck="false">
        <button id="send" type="submit" aria-label="Send">&#8593;</button>
      </form>
    </section>

    <div id="orb-zone">
      <button id="orb" type="button" aria-label="Open fren"></button>
    </div>
  </div>
<script src="face/palette.js"></script>
<script src="markdown.js"></script>
<script src="face/reactions.js"></script>
<script src="face/shake.js"></script>
<script src="mic.js"></script>
<!-- The SVG renderer loads first and stays as the fallback. orb.js replaces it
     with the 3D one only if WebGL actually works here, so a graphics failure
     degrades to a working face instead of a blank window. Module scripts run
     in order after the classic ones, so app.js sees whichever won. -->
<script src="face/face.js"></script>
<script type="module" src="face/orb.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
