<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' fren:; style-src 'self' 'unsafe-inline'; script-src 'self' fren:; img-src 'self' fren: data:">
<title>fren</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- macOS hides the title bar but keeps the traffic lights, so the sidebar
       needs headroom for them. -->
  <div id="titlebar"></div>

  <div id="shell">
    <nav id="side" aria-label="Sections">
      <div class="brand">
        <span class="wordmark" role="img" aria-label="fren"></span>
      </div>

      <!-- Today and yesterday are pinned. Everything else about the ordering
           follows from one measurement: with the day list above the sections,
           on a 720px window Patterns began at y=704 against a fold at 680 — so
           not a single navigation item was visible without scrolling, and
           Settings was 301px down. Navigation is fixed now and only history
           scrolls. -->
      <!-- Chat, today and yesterday are one thing: what has been going on. The
           conversation leads it because it is what the window opens on, and the
           days are what fren saw while you were not talking to it. -->
      <div class="side-group" id="activity">
        <div class="side-label">Activity</div>
        <button class="side-item" data-section="chat"><span>Chat</span></button>
        <!-- Today and yesterday land here, under the same heading. -->
        <div id="day-quick"></div>
      </div>

      <div class="side-group">
        <div class="side-label">What fren noticed</div>
        <button class="side-item" data-section="patterns">
          <span>Patterns</span><span id="side-pattern-count" class="side-count" hidden></span>
        </button>
      </div>

      <div class="side-group">
        <div class="side-label">What it runs</div>
        <button class="side-item" data-section="automations">
          <span>Automations</span><span id="side-auto-count" class="side-count" hidden></span>
        </button>
        <button class="side-item" data-section="routines">
          <span>Routines</span><span id="side-routine-count" class="side-count" hidden></span>
        </button>
        <!-- What an agent asked to be allowed to do. The count is the open ones;
             an open one is a question waiting for you. -->
        <button class="side-item" data-section="requests">
          <span>Requests</span><span id="side-request-count" class="side-count" hidden></span>
        </button>
      </div>

      <!-- What fren holds about you, and the two switches that decide what it
           does on its own. These used to live in the small chat panel, where
           they were tabs competing with the conversation. They belong here:
           this is the window you open to look at things. -->
      <div class="side-group">
        <div class="side-label">About you</div>
        <button class="side-item" data-section="memory"><span>Memory</span></button>
        <button class="side-item" data-section="settings"><span>Settings</span></button>
      </div>

      <!-- Last, and the only thing that scrolls. It also holds every day now:
           getActiveDays fetches 60 and the old list rendered 14 of them with no
           way to reach the rest. -->
      <div class="side-group" id="history">
        <div class="side-label">Earlier</div>
        <div id="day-list"></div>
      </div>

      <!-- The same merged control the panel header has: it states whether fren
           is watching AND changes it. This window already knew the answer and
           showed it as inert text, which meant seeing "watching" here and
           having to go back to the orb to do anything about it. -->
      <div class="side-foot">
        <button id="side-status" type="button" role="switch" aria-checked="false">
          <i></i><span>paused</span>
        </button>
      </div>
    </nav>

    <main id="main">
      <header id="main-head">
        <h1 id="title">Today</h1>
        <p id="subtitle"></p>
        <!-- The inverse of the panel's Expand: back to the orb, with the
             conversation still open beside it. -->
        <button id="collapse" type="button" title="Back to the orb">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M10 4v6H4M4 10l7-7M14 20v-6h6M20 14l-7 7"/>
          </svg>
          <span>Collapse</span>
        </button>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <!-- Before anything paints: main knows where macOS drew this window's own
       buttons, and the Collapse button lines up with them. Inline and first, so
       there is no frame where it sits at the fallback position. -->
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const set = (param, prop) => {
        const n = Number(q.get(param));
        if (Number.isFinite(n) && n > 0 && n < 200) {
          document.documentElement.style.setProperty(prop, n + 'px');
        }
      };
      set('tl', '--traffic-centre');   // vertical centre of the window buttons
      set('ti', '--chrome-inset');     // how far they are tucked in from the edge
    })();
  </script>
  <script src="face/palette.js"></script>
  <script src="markdown.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
