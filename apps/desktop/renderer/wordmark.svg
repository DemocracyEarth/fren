<!-- The fren wordmark, traced from the supplied artwork.
     Marching squares on the alpha channel with sub-pixel interpolation at the
     50 percent threshold, so the curves follow the anti-aliased edge rather
     than the pixel grid. Measured against the source at full size: 2.2 percent
     of ink pixels disagree, all of it a one-pixel boundary halo, none of it
     structural.

     Used as a CSS mask so it takes its colour from the ink token and there is
     exactly one copy of the artwork in the repo.

     NOTE: SVG is XML, so a double hyphen cannot appear inside this comment.
     Writing a CSS custom property here once made the whole file fail to parse,
     and a mask whose source will not parse masks everything away silently. -->
