<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fren — expression sheet</title>
<style>
  html, body { margin: 0; background: #0B0B0D; color: #8b857c;
               font-family: ui-rounded, system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px; }
  figure { margin: 0; text-align: center; }
  /* Each cell paints on that expression's own body colour, so the sheet shows
     what you would actually see rather than a face floating on a swatch. */
  .orb { width: 168px; height: 168px; border-radius: 50%; position: relative;
         overflow: hidden; box-shadow: inset -14px -18px 34px rgba(0,0,0,0.42),
                                       inset 12px 14px 26px rgba(255,255,255,0.16); }
  .orb canvas { width: 100%; height: 100%; display: block; mix-blend-mode: screen; }
  figcaption { font-size: 12px; padding-top: 6px; color: #cfc7bb; }
</style>
</head>
<body>
  <div class="row" id="sheet"></div>
<script type="module">
  import { drawFace } from '/face/face-texture.js';
  import { TONE, EXPRESSIONS } from '/face/expressions.js';

  const host = document.getElementById('sheet');
  for (const [name, e] of Object.entries(EXPRESSIONS)) {
    const tone = TONE[e.tone] || TONE.base;
    const hex = '#' + tone.color.toString(16).padStart(6, '0');

    const fig = document.createElement('figure');
    const orb = document.createElement('div');
    orb.className = 'orb';
    // Dim the body the way the 3D material does when the light is low.
    const lit = e.lit ?? 1;
    orb.style.background = lit < 0.5
      ? `color-mix(in srgb, ${hex} ${Math.round(lit * 105)}%, #46464a)`
      : hex;

    const c = document.createElement('canvas');
    c.width = c.height = 512;
    drawFace(c, { lit, ...e });

    const cap = document.createElement('figcaption');
    cap.textContent = name;
    orb.appendChild(c);
    fig.append(orb, cap);
    host.appendChild(fig);
  }
</script>
</body>
</html>
